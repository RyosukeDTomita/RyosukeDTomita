name: Profile Cards

# READMEのカードSVGを自前生成してコミットする。
# 共有ホスト(*.vercel.app)の障害やレート制限に影響されないようにするため。
#   profile-summary-card-output/ : github-profile-summary-cards
#   github-readme-stats-output/  : github-readme-stats
on:
  schedule:
    - cron: "0 15 * * *" # 毎日 00:00 JST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-profile-cards
    timeout-minutes: 15
    permissions:
      contents: write # カードの生成結果をpushするため
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@d9632798b299e9ad6940449a859c30742eb5b549 # v0.12.0
        env:
          # カード生成時のGitHub API問い合わせ用。読み取り権限のみでよい
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 9
          EXCLUDE: "HTML,Dockerfile,JavaScript"
          # commitカードは「コミット先リポジトリのprimary language」に集計するため、
          # 中身がコードでないリポジトリはノイズになる。言語単位ではなくリポジトリごと除外する
          #   obsidian : vault。同梱pluginのせいでprimary languageがC#と判定される
          #   memo     : ノート置き場。primary languageがJupyter Notebookと判定される
          EXCLUDE_REPOS: "obsidian,memo"
          # persist-credentials: false のためAction内のpushは使えない。最後のstepで明示的にpushする
          AUTO_PUSH: false
          THEME: "solarized_dark" # 空にすると全テーマ生成

      # 本家 anuraghazra/github-readme-stats はメンテ終了。後継のstats-organizationが出している
      # 公式Actionを使うと、vercelインスタンスを立てずにSVGを生成できる
      - name: Generate github-readme-stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=solarized-dark
          path: github-readme-stats-output/stats.svg
          token: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

      - name: Commit and push cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain profile-summary-card-output github-readme-stats-output)" ]; then
            echo "No card changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-summary-card-output github-readme-stats-output
          git commit -m 'chore: update profile cards'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
